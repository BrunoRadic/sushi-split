name: Scrape

# Wolt blokira GitHubove IP adrese (429), pa se scrape redovno radi s Maca (scripts/update.sh).
# Ovaj workflow ostaje samo za ručni pokušaj iz Actions taba.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Povuci podatke s Wolta
        run: python scraper/build.py
      - name: Spremi promjene
        run: |
          git config user.name "sushi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Podaci $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
